<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0d0c" />
    <meta
      name="description"
      content="Mishari — videomaker and photographer. Wedding, music video, events, brand story and editorial photography with a cinematic touch."
    />
    <meta property="og:title" content="Mishari | Videomaker & Photographer" />
    <meta property="og:description" content="Images, films and visual content with a cinematic touch." />
    <meta property="og:type" content="website" />
    <title>Mishari | Videomaker &amp; Photographer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body id="top">
    <a class="skip-link" href="#portfolio">Skip to portfolio</a>

    <!-- ===== Discreet bookmark: private access (only you know) ===== -->
    <a class="bookmark-dot" href="admin.html" aria-label="Private access" title="">
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
        <path d="M6 3h12v18l-6-4-6 4V3z" fill="currentColor"/>
      </svg>
    </a>

    <!-- ===== Minimal header ===== -->
    <header class="site-header" aria-label="Header">
      <a class="brand" href="#top">Mishari</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="#portfolio">Services</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <main>
      <!-- ===== Compact banner ===== -->
      <section class="banner" aria-label="Intro">
        <h1 class="sr-only">Mishari — Videomaker &amp; Photographer</h1>
        <p class="eyebrow">Videomaker &amp; Photographer</p>
      </section>

      <!-- ===== Category showcase: mouse-driven scroll ===== -->
      <section class="stage" id="portfolio" aria-label="Featured services">
        <div class="stage-viewport" id="stageViewport">
          <div class="stage-track" id="stageTrack" aria-live="off"></div>
        </div>
        <!-- Scroll zones: mouse right = next, left = previous -->
        <div class="stage-edge prev" id="edgePrev" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Prev</span>
        </div>
        <div class="stage-edge next" id="edgeNext" aria-hidden="true">
          <span>Next</span>
          <svg viewBox="0 0 24 24" width="26" height="26"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </section>

      <!-- ===== Contact ===== -->
      <section class="contact" id="contact">
        <div class="contact-head reveal">
          <p class="contact-lead">Tell me your idea.</p>
          <button class="btn-soft quote-open" type="button">Let's talk <span aria-hidden="true">→</span></button>
        </div>
        <address class="contact-list reveal">
          <a class="contact-row" href="mailto:info@example.com">
            <span class="contact-label">Email</span>
            <span class="contact-value">info@example.com</span>
          </a>
          <a class="contact-row" href="tel:+390000000000">
            <span class="contact-label">Phone</span>
            <span class="contact-value">+39 000 000 0000</span>
          </a>
        </address>
      </section>

      <footer class="site-footer">
        <span>© <span id="year"></span> Mishari</span>
        <span>Videomaker &amp; Photographer</span>
      </footer>
    </main>

    <!-- ===== Modal: get in touch ===== -->
    <div class="modal" id="quoteModal" role="dialog" aria-modal="true" aria-labelledby="quoteTitle" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card">
        <button class="modal-close" type="button" aria-label="Close" data-close>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <p class="eyebrow">Get in touch</p>
        <h2 id="quoteTitle">Tell me about your project</h2>
        <form class="quote-form" id="quoteForm" novalidate>
          <label>Full name<input required name="name" type="text" autocomplete="name" /></label>
          <div class="form-row">
            <label>Email<input required name="email" type="email" autocomplete="email" /></label>
            <label>Phone<input name="phone" type="tel" autocomplete="tel" /></label>
          </div>
          <label>Service
            <select name="service" id="quoteService"></select>
          </label>
          <label>Message<textarea name="message" rows="4" placeholder="Date, location, project idea…"></textarea></label>
          <button class="btn btn-primary" type="submit">Send message</button>
          <p class="form-note" id="quoteFeedback" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <!-- ===== Social ===== -->
    <aside class="social-dock" aria-label="Social profiles">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/>
        </svg>
      </a>
      <a href="https://www.tiktok.com/" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M14 3c.3 2.2 1.7 3.9 4 4.2v3c-1.5 0-2.9-.5-4-1.3V15a5.5 5.5 0 1 1-5.5-5.5c.3 0 .6 0 .9.1v3.1a2.5 2.5 0 1 0 1.7 2.4V3H14z" fill="currentColor"/>
        </svg>
      </a>
    </aside>

    <script src="js/data.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
