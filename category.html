<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0d0c" />
    <meta name="description" content="Photo and video service — Mishari." />
    <title>Service | Mishari</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="category.css" />
  </head>
  <body id="top">
    <a class="bookmark-dot" href="admin.html" aria-label="Private access" title="">
      <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
        <path d="M6 3h12v18l-6-4-6 4V3z" fill="currentColor"/>
      </svg>
    </a>

    <header class="site-header" aria-label="Header">
      <a class="brand" href="index.html">Mishari</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="index.html#portfolio">Services</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </header>

    <main id="catRoot">
      <!-- filled by js/category.js -->
    </main>

    <!-- Shared contact modal -->
    <div class="modal" id="quoteModal" role="dialog" aria-modal="true" aria-labelledby="quoteTitle" hidden>
      <div class="modal-backdrop" data-close></div>
      <div class="modal-card">
        <button class="modal-close" type="button" aria-label="Close" data-close>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <p class="eyebrow">Get in touch</p>
        <h2 id="quoteTitle">Tell me about your project</h2>
        <form class="quote-form" id="quoteForm" novalidate>
          <label>Full name<input required name="name" type="text" autocomplete="name" /></label>
          <div class="form-row">
            <label>Email<input required name="email" type="email" autocomplete="email" /></label>
            <label>Phone<input name="phone" type="tel" autocomplete="tel" /></label>
          </div>
          <label>Service<select name="service" id="quoteService"></select></label>
          <label>Message<textarea name="message" rows="4" placeholder="Date, location, project idea…"></textarea></label>
          <button class="btn btn-primary" type="submit">Send message</button>
          <p class="form-note" id="quoteFeedback" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <!-- Photo lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
      <div class="lightbox-backdrop" data-close></div>
      <button class="lightbox-close" type="button" aria-label="Close" data-close>
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <button class="lightbox-nav prev" type="button" aria-label="Previous"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <figure class="lightbox-stage">
        <img id="lbImage" src="" alt="" />
        <figcaption class="lightbox-cap"><span id="lbCap"></span><span class="lb-count" id="lbCount"></span></figcaption>
      </figure>
      <button class="lightbox-nav next" type="button" aria-label="Next"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>

    <script src="js/data.js"></script>
    <script src="js/site.js"></script>
    <script src="js/category.js"></script>
  </body>
</html>
